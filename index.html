<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#05070b"><title>PERSEPOLIS</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#020305;color:#fff;font-family:system-ui,sans-serif}body{overflow:hidden}.app{height:100%;max-width:430px;margin:auto;background:radial-gradient(circle at 50% 10%,#3d1d0d,#0a1119 42%,#020305);position:relative}header{height:68px;padding:12px;display:flex;justify-content:space-between;align-items:center}.brand{color:#ffd45a;font-weight:900;letter-spacing:2px}.pill{border:1px solid #66502b;border-radius:99px;padding:7px 10px;font-size:11px}main{position:absolute;top:68px;bottom:72px;left:0;right:0;overflow:auto;padding:12px}.hero,.card{border:1px solid #293847;border-radius:18px;background:#0b141e;padding:16px}.hero{text-align:center}.seal{font-size:50px;color:#ffd45a}h1,h2{color:#ffd45a}h1{margin:4px}.sub,.muted{color:#91a0ad}.big{font-size:34px;font-weight:900}.stat{font-size:21px;font-weight:900;color:#ffd45a}.label{font-size:10px;color:#91a0ad;text-transform:uppercase}.green{color:#49e18b}.row{display:flex;gap:10px}.row>*{flex:1}.progress{height:9px;background:#101a24;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#f23b24,#ffd65a)}.btn{width:100%;border:0;border-radius:13px;padding:14px;font-weight:900;color:#fff;background:linear-gradient(#ff432d,#ae0f0a)}.gold{background:linear-gradient(#ffdc67,#b66a12);color:#160f05}.secondary{background:#101a24;border:1px solid #2b4355}.btn:disabled{opacity:.45}.sp{height:10px}.task{display:flex;align-items:center;gap:10px;margin-bottom:10px}.grow{flex:1}.task button{padding:9px;border:0;border-radius:9px;background:#ffb52e;font-weight:900}nav{position:absolute;bottom:0;left:0;right:0;height:72px;background:#060b11;border-top:1px solid #263443;display:grid;grid-template-columns:repeat(5,1fr)}nav button{border:0;background:none;color:#82909c;font-size:10px;font-weight:800}nav button b{display:block;font-size:21px}nav button.active{color:#ff3a27}.toast{position:absolute;bottom:85px;left:12px;right:12px;padding:12px;border:1px solid #ff432b;border-radius:12px;background:#081018;text-align:center}.error{text-align:center;padding:40px 12px;color:#ff8276}
</style></head><body><div class="app"><header><div class="brand">𐎱 PERSEPOLIS</div><div id="user" class="pill">LEVEL 1</div></header><main id="view"></main><nav id="nav"></nav></div><script>
const tg=window.Telegram?.WebApp;tg?.ready?.();tg?.expand?.();const API=location.origin;const levels=Array.from({length:400},(_,i)=>({level:i+1,hold:i?Math.round(100+Math.pow(i/399,1.42)*149900):0,speed:i===11?125.6:i===399?500:+(1+i/399*499).toFixed(2)}));levels[11]={level:12,hold:15000,speed:125.6};
let state={level:1,balance:0,mined:0,energy:200,mining:false,wallet:"",referrals:0,earned:0},screen="home";const V=document.getElementById("view"),N=document.getElementById("nav"),U=document.getElementById("user");
async function api(p,b={}){let r=await fetch(API+p,{method:"POST",headers:{"content-type":"application/json","X-Telegram-Init-Data":tg?.initData||""},body:JSON.stringify(b)}),j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||"Request failed");return j}
function note(s){let d=document.createElement("div");d.className="toast";d.textContent=s;document.querySelector(".app").append(d);setTimeout(()=>d.remove(),1800)}
function setScreen(s){screen=s;render()}function nav(){N.innerHTML=[["home","⌂","Home"],["tasks","✓","Tasks"],["level","↟","Upgrade"],["friends","♙","Friends"],["wallet","▣","Wallet"]].map(x=>`<button class="${screen===x[0]?"active":""}" onclick="setScreen('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join("")}
function render(){U.textContent="LEVEL "+state.level;let l=levels[state.level-1],n=levels[state.level],h="";
if(screen==="home")h=`<section class="hero"><div class="seal">♛</div><h1>PERSEPOLIS</h1><p class="sub">MINE • BUILD • EARN</p><div class="card" style="text-align:left"><div class="label">PERS BALANCE</div><div class="big">${state.balance.toFixed(2)}</div><div class="green">+${l.speed} PERS / HOUR</div><div class="progress"><i style="width:${Math.min(100,state.energy/2)}%"></i></div><div class="row"><div><div class="stat">${Math.floor(state.energy)}/200</div><div class="label">ENERGY</div></div><div><div class="stat">${state.level}</div><div class="label">LEVEL</div></div></div></div><div class="sp"></div><button class="btn" onclick="mine()">${state.mining?"STOP MINING":"START MINING"}</button></section>`;
if(screen==="level")h=`<section><h2>LEVEL ${state.level}</h2><div class="card"><div class="row"><div><div class="stat">${l.speed}</div><div class="label">PERS / HOUR</div></div><div><div class="stat">${n?n.hold.toLocaleString():"MAX"}</div><div class="label">UPGRADE COST</div></div></div>${n?`<div class="progress"><i style="width:${Math.min(100,state.balance/n.hold*100)}%"></i></div><p class="muted">Paid from the user's own PERS balance. Liquidity is never used.</p><button class="btn gold" onclick="upgrade()" ${state.balance<n.hold?"disabled":""}>UPGRADE TO LEVEL ${n.level}</button>`:`<button class="btn secondary" disabled>MAX LEVEL</button>`}</div></section>`;
if(screen==="wallet")h=`<section><h2>WALLET</h2><div class="hero"><div class="label">IN-APP PERS</div><div class="big">${state.balance.toFixed(2)}</div><div class="label">TON WALLET</div><p class="muted">${state.wallet||"Not connected"}</p><button class="btn" onclick="wallet()">CONNECT TON WALLET</button></div><div class="sp"></div><button class="btn secondary" onclick="setScreen('buy')">BUY / SELL PERS</button></section>`;
if(screen==="buy")h=`<section><h2>MARKET</h2><div class="card"><p class="muted">Trading stays disabled until a real verified PERS/TON DEX route is configured. No fake price or swap.</p><button class="btn secondary" disabled>BUY PERS — NOT ENABLED</button><div class="sp"></div><button class="btn secondary" disabled>SELL PERS — NOT ENABLED</button></div></section>`;
if(screen==="tasks")h=`<section><h2>DAILY TASKS</h2><div class="card task"><div class="grow"><b>Daily check-in</b><div class="green">+500 PERS</div></div><button onclick="task()">CLAIM</button></div></section>`;
if(screen==="friends")h=`<section><h2>INVITE FRIENDS</h2><div class="hero"><div class="seal">♜</div><p class="sub">Referral rewards are credited only for real Telegram referrals.</p><button class="btn" onclick="invite()">COPY REFERRAL LINK</button><div class="sp"></div><div class="row"><div class="card"><div class="stat">${state.referrals}</div><div class="label">INVITED</div></div><div class="card"><div class="stat">${state.earned}</div><div class="label">EARNED</div></div></div></div></section>`;
V.innerHTML=h;nav()}
async function refresh(){try{let j=await api("/api/bootstrap");state={...state,...j.state};render()}catch(e){V.innerHTML='<div class="error">Open PERSEPOLIS from the Telegram bot.<br><br>'+e.message+"</div>";nav()}}
async function mine(){try{let j=await api(state.mining?"/api/mine/stop":"/api/mine/start");state={...state,...j.state};note(state.mining?"Mining started":"Mining stopped");render()}catch(e){note(e.message)}}
async function upgrade(){try{let j=await api("/api/level/upgrade");state={...state,...j.state};note("Level upgraded");render()}catch(e){note(e.message)}}
async function task(){try{let j=await api("/api/tasks/claim",{taskId:"daily"});state={...state,...j.state};note("Reward claimed");render()}catch(e){note(e.message)}}
async function wallet(){let w=prompt("TON wallet address");if(!w)return;try{let j=await api("/api/wallet/bind",{wallet:w});state={...state,...j.state};note("Wallet connected");render()}catch(e){note(e.message)}}
function invite(){let id=tg?.initDataUnsafe?.user?.id;if(!id)return note("Telegram user is required");navigator.clipboard?.writeText("https://t.me/PERSEPOLIS_BOT?start=ref_"+id);note("Referral link copied")}
refresh();setInterval(refresh,15000);
</script></body></html>
