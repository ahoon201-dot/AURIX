<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>PERSEPOLIS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#05070b;--panel:#0c1520;--gold:#ffd65a;--red:#ff2e20;--green:#39f28a;--muted:#91a0ad}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020305;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}.app{height:100%;max-width:430px;margin:auto;position:relative;background:radial-gradient(circle at 50% 20%,#45200d 0,#0a0e14 40%,#020305 100%);overflow:hidden}
.app:before{content:"PERSEPOLIS";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff1;letter-spacing:7px;font-size:38px;font-weight:900;transform:rotate(-90deg);pointer-events:none}
header{height:72px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.brand{font-weight:1000;letter-spacing:2px;color:var(--gold);font-size:20px}.user{font-size:12px;color:#fff}.pill{border:1px solid #70552b;background:#111821;border-radius:999px;padding:8px 11px}
main{position:absolute;top:72px;bottom:74px;left:0;right:0;overflow:auto;padding:12px 14px 24px;scrollbar-width:none}main::-webkit-scrollbar{display:none}
.hero{border:1px solid #503c20;border-radius:24px;background:linear-gradient(160deg,#1c1b18cc,#071019ee);padding:20px;box-shadow:0 0 35px #ff40121a}
.crown{font-size:50px;text-align:center;filter:drop-shadow(0 0 15px #ff5a22)}h1,h2,p{margin:0}h1{font-size:30px;text-align:center;color:var(--gold);margin-top:8px}h2{font-size:20px;color:var(--gold);margin-bottom:10px}.sub{text-align:center;color:#d2d7db;margin:8px 0 20px}
.btn{width:100%;border:0;border-radius:15px;padding:14px 16px;font-weight:900;color:#fff;background:linear-gradient(#ff3a28,#b30d0a);box-shadow:0 0 18px #ff241e55;cursor:pointer}.btn.secondary{background:#111b26;border:1px solid #2a465c;box-shadow:none}.btn.gold{background:linear-gradient(#ffd95f,#b66a12);color:#171006}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:1px solid #263747;border-radius:17px;background:#0a131d;padding:14px}.stat{font-size:22px;font-weight:900;color:var(--gold)}.label{font-size:11px;color:var(--muted);margin-top:4px}
.progress{height:10px;background:#111c27;border-radius:99px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#ff3d20,#ffd24d);border-radius:99px}
.task{display:flex;align-items:center;gap:10px;margin:8px 0}.task .icon{width:40px;height:40px;border-radius:12px;background:#152535;display:grid;place-items:center}.task .grow{flex:1}.task button{width:80px;padding:9px;border-radius:10px;border:0;background:#ffb52e;font-weight:900}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.big{font-size:34px;font-weight:1000;color:#fff}.green{color:var(--green)}.gold{color:var(--gold)}.muted{color:var(--muted)}
nav{position:absolute;left:0;right:0;bottom:0;height:74px;background:#060b11f5;border-top:1px solid #263443;display:grid;grid-template-columns:repeat(5,1fr);z-index:5}nav button{border:0;background:none;color:#82909c;font-size:10px;font-weight:800}nav button b{display:block;font-size:22px;margin-bottom:3px}nav button.active{color:#ff3a27}
.toast{position:absolute;z-index:20;left:12px;right:12px;bottom:88px;background:#081018;border:1px solid #ff432b;border-radius:14px;padding:12px;text-align:center;font-weight:900}
table{width:100%;border-collapse:collapse}td{padding:9px 4px;border-bottom:1px solid #1b2a37;font-size:12px}td:last-child{text-align:left;color:var(--gold);font-weight:900}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">𐎱 PERSEPOLIS</div><div id="user" class="pill">LEVEL 1</div></header>
<main id="view"></main>
<nav id="nav"></nav>
</div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready?.(); tg?.expand?.();
const API=location.origin;
const levels=Array.from({length:400},(_,i)=>({level:i+1,hold:i===0?0:Math.round(100+Math.pow(i/399,1.42)*149900),speed:i===11?125.6:i===399?500:+(1+(i/399)*499).toFixed(2)}));
let state={level:1,balance:0,mined:0,energy:200,mining:false,wallet:"",referrals:0,earned:0};
let screen="home",toastTimer;
const view=document.getElementById("view"),nav=document.getElementById("nav"),user=document.getElementById("user");
async function call(path,body={}){const r=await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json","X-Telegram-Init-Data":tg?.initData||""},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||"Request failed");return j}
function notify(x){clearTimeout(toastTimer);let d=document.createElement("div");d.className="toast";d.textContent=x;document.querySelector(".app").append(d);toastTimer=setTimeout(()=>d.remove(),1800)}
function L(){return levels[state.level-1]||levels[0]}
function setScreen(x){screen=x;render()}
function renderNav(){nav.innerHTML=[["home","⌂","Home"],["tasks","✓","Tasks"],["level","↟","Upgrade"],["friends","♙","Friends"],["wallet","▣","Wallet"]].map(([id,i,t])=>`<button class="${screen===id?'active':''}" onclick="setScreen('${id}')"><b>${i}</b>${t}</button>`).join("")}
function render(){
 user.textContent=`LEVEL ${state.level}`;
 const n=L(), next=levels[state.level];
 let h="";
 if(screen==="home")h=`<section class="hero"><div class="crown">♛</div><h1>PERSEPOLIS</h1><p class="sub">MINE • BUILD • EARN</p><div class="card"><div class="label">PERS BALANCE</div><div class="big">${(state.balance+state.mined).toFixed(2)}</div><div class="green">+${n.speed} PERS / HOUR</div><div class="progress"><i style="width:${Math.min(100,state.energy/2)}%"></i></div><div class="row"><div><div class="stat">${Math.floor(state.energy)}/200</div><div class="label">ENERGY</div></div><div><div class="stat">${state.level}</div><div class="label">LEVEL</div></div></div></div><br><button class="btn" onclick="toggleMine()">${state.mining?"STOP MINING":"START MINING"}</button></section>`;
 if(screen==="level"){let x=next||n;h=`<section><h2>LEVEL ${state.level}</h2><div class="card"><div class="row"><div><div class="stat">${n.speed}</div><div class="label">PERS/H</div></div><div><div class="stat">${x?.hold?.toLocaleString()||"MAX"}</div><div class="label">NEXT HOLD</div></div></div><div class="progress"><i style="width:${x?Math.min(100,(state.balance/x.hold)*100):100}%"></i></div><p class="muted">Upgrade costs PERS from your own balance. Liquidity is never used.</p><br>${next?`<button class="btn gold" onclick="upgrade()">UPGRADE TO LEVEL ${next.level}</button>`:`<button class="btn secondary">MAX LEVEL</button>`}</div></section>`;
 if(screen==="wallet")h=`<section><h2>WALLET</h2><div class="hero"><div class="label">IN-APP PERS BALANCE</div><div class="big">${state.balance.toFixed(2)} PERS</div><p class="muted">${state.wallet||"No TON wallet connected"}</p><br><button class="btn" onclick="connectWallet()">CONNECT TON WALLET</button></div><br><button class="btn secondary" onclick="setScreen('buy')">BUY / SELL PERS</button></section>`;
 if(screen==="buy")h=`<section><h2>BUY PERS</h2><div class="card"><div class="label">TON → PERS</div><div class="stat">REAL SWAP ONLY</div><p class="muted">The app never fakes a token price or swap. Configure a verified TON/DEX route before enabling trading.</p><br><button class="btn secondary" onclick="notify('DEX route is not enabled yet')">BUY PERS</button><br><br><button class="btn secondary" onclick="notify('DEX route is not enabled yet')">SELL PERS</button></div></section>`;
 if(screen==="mining")h=`<section><h2>MINING</h2><div class="hero" style="text-align:center"><div class="big">${Math.floor(state.energy)} / 200</div><div class="label">ENERGY</div><br><div class="stat">+${n.speed} PERS/H</div><p class="muted">${state.mining?"MINING ACTIVE":"MINING STOPPED"}</p><br><button class="btn" onclick="toggleMine()">${state.mining?"STOP":"START MINING"}</button><br><br><button class="btn gold" onclick="claim()">CLAIM PERS</button></div></section>`;
 if(screen==="tasks")h=`<section><h2>DAILY TASKS</h2>${[["daily","Check in daily",500],["telegram","Join Telegram",1000],["x","Follow on X",1000],["invite","Invite 3 friends",5000],["video","Watch Video",1000],["swap","Swap PERS",2000]].map(x=>`<div class="card task"><div class="icon">★</div><div class="grow"><b>${x[1]}</b><div class="green">+${x[2]} PERS</div></div><button onclick="task('${x[0]}',${x[2]})">CLAIM</button></div>`).join("")}</section>`;
 if(screen==="friends")h=`<section><h2>INVITE FRIENDS</h2><div class="hero"><div class="crown">♜</div><h2>Earn together</h2><p class="sub">Invite friends and earn referral rewards.</p><button class="btn" onclick="invite()">COPY REFERRAL LINK</button><br><br><div class="row"><div class="card"><div class="stat">${state.referrals}</div><div class="label">INVITED</div></div><div class="card"><div class="stat">${state.earned}</div><div class="label">EARNED PERS</div></div></div></div></section>`;
 if(screen==="leaderboard")h=`<section><h2>LEADERBOARD</h2><div class="card"><table><tr><td>♛ You</td><td>${(state.balance+state.mined).toFixed(0)} PERS</td></tr><tr><td>2. Top Miner</td><td>—</td></tr><tr><td>3. Top Miner</td><td>—</td></tr></table></div></section>`;
 if(screen==="profile")h=`<section><h2>PROFILE</h2><div class="hero"><div class="big">LEVEL ${state.level}</div><div class="label">TOTAL EARNED</div><div class="stat">${state.balance.toFixed(2)} PERS</div><br><div class="label">REFERRAL EARNED</div><div class="stat">${state.earned} PERS</div></div></section>`;
 view.innerHTML=h;renderNav()
}
async function bootstrap(){try{let j=await call("/api/bootstrap");if(j.state)state={...state,...j.state}}catch(e){}render()}
async function toggleMine(){try{let j=await call(state.mining?"/api/mine/stop":"/api/mine/start");state={...state,...j.state};notify(state.mining?"Mining started":"Mining stopped");render()}catch(e){notify(e.message)}}
async function claim(){try{let j=await call("/api/mine/claim");state={...state,...j.state};notify("PERS claimed");render()}catch(e){notify(e.message)}}
async function task(id,reward){try{let j=await call("/api/tasks/claim",{taskId:id});state={...state,...j.state};notify("Reward claimed");render()}catch(e){notify(e.message)}}
async function upgrade(){try{let j=await call("/api/level/upgrade");state={...state,...j.state};notify("Level upgraded");render()}catch(e){notify(e.message)}}
async function connectWallet(){let w=prompt("TON wallet address");if(!w)return;try{let j=await call("/api/wallet/bind",{wallet:w});state={...state,...j.state};notify("Wallet connected");render()}catch(e){notify(e.message)}}
function invite(){let id=tg?.initDataUnsafe?.user?.id||"user";let u=`https://t.me/PERSEPOLIS_BOT?start=ref_${id}`;navigator.clipboard?.writeText(u);notify("Referral link copied")}
bootstrap();setInterval(()=>{if(state.mining){state.mined+=L().speed/3600;state.energy=Math.max(0,state.energy-L().speed/3600);render()}},1000);
</script>
</body></html>
