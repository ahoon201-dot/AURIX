<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PERSEPOLIS PAYOUT TEST</title>

  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

  <style>
    body{
      margin:0;
      padding:20px;
      background:#0b1220;
      color:white;
      font-family:Arial,sans-serif;
    }

    .box{
      max-width:520px;
      margin:40px auto;
      background:#111a2b;
      padding:24px;
      border-radius:20px;
    }

    h1{
      text-align:center;
      margin-top:0;
    }

    .wallet{
      margin:20px 0;
      padding:15px;
      background:#18243a;
      border-radius:12px;
      word-break:break-all;
    }

    .status{
      margin-top:20px;
      padding:15px;
      background:#0b1220;
      border-radius:12px;
      word-break:break-word;
    }

    .test{
      margin-top:20px;
      padding:14px;
      background:#24324a;
      border-radius:12px;
      text-align:center;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🏛️ PERSEPOLIS PAYOUT</h1>

  <div id="ton-connect"></div>

  <div class="wallet">
    <b>Payout Wallet</b><br><br>
    UQC3-z4up-Kdmn3q_ETH9WrNDfCGGrHBUY3T1yaF9Zs7DjS
  </div>

  <div class="status" id="status">
    Waiting for wallet connection...
  </div>

  <div class="test">
    🧪 ADMIN PAGE TEST<br><br>
    Real PERS transfers are disabled for now.
  </div>

</div>

<script>

const PAYOUT_WALLET =
  "UQC3-z4up-Kdmn3q_ETH9WrNDfCGGrHBUY3T1yaF9Zs7DjS";

const statusEl =
  document.querySelector("#status");

function status(text){
  statusEl.textContent = text;
}

if(!window.TON_CONNECT_UI){

  status(
    "❌ TON Connect library failed to load."
  );

}else{

  try{

    const tonConnectUI =
      new TON_CONNECT_UI.TonConnectUI({

        manifestUrl:
          "https://persepolis.ahoon201.workers.dev/tonconnect-manifest.json?v=5",

        buttonRootId:
          "ton-connect"

      });

    tonConnectUI.onStatusChange(wallet => {

      if(!wallet){

        status(
          "Connect PERSEPOLIS PAYOUT wallet."
        );

        return;
      }

      const address =
        wallet.account?.address || "";

      if(!address){

        status(
          "⚠️ Wallet connected but address was not received."
        );

        return;
      }

      if(
        address === PAYOUT_WALLET
      ){

        status(
          "✅ PERSEPOLIS PAYOUT wallet connected."
        );

      }else{

        status(
          "⚠️ Wrong wallet. Please connect PERSEPOLIS PAYOUT wallet."
        );

      }

    });

  }catch(error){

    console.error(error);

    status(
      "❌ TON Connect error: " +
      (error?.message || error)
    );

  }

}

</script>

</body>
</html>
